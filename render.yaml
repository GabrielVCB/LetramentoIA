# Sentinela — publicação na Render (https://render.com), plano gratuito.
#
# Arquitetura:
#   - o servidor web roda na Render, plano Free;
#   - o banco fica FORA, em um Postgres gratuito (Neon ou Supabase), informado
#     em SENTINELA_DB_URL. No plano Free a Render não tem disco persistente, e
#     sem banco externo os alertas seriam apagados a cada reinício;
#   - um monitor externo (UptimeRobot) chama /api/ping a cada 5 minutos para o
#     serviço não hibernar por inatividade.
#
# Como usar:
#   1. Crie o banco externo e copie a string de conexão (postgresql://...).
#   2. Suba o projeto no GitHub, com este arquivo na raiz do repositório.
#   3. Na Render: New → Blueprint → escolha o repositório.
#   4. Informe SENTINELA_ADMIN_SENHA e SENTINELA_DB_URL quando ela pedir.
#   5. Depois do deploy, abra /painel → 06 · Instalação e copie o endereço e o
#      código para as Opções da extensão em cada computador.

services:
  - type: web
    name: sentinela
    runtime: python
    plan: free
    rootDir: servidor
    buildCommand: pip install -r requirements.txt
    # Um processo com várias threads. Com o banco externo, dá para aumentar o
    # número de workers depois; o SQLite local é que exigia um só.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/ping
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: SENTINELA_SECRET_KEY
        generateValue: true
      - key: SENTINELA_ADMIN_USUARIO
        value: admin
      - key: SENTINELA_ADMIN_SENHA
        sync: false
      # Banco Postgres externo. O servidor cria as tabelas sozinho no primeiro
      # acesso; basta colar a string de conexão.
      - key: SENTINELA_DB_URL
        sync: false
      - key: SENTINELA_COOKIE_SEGURO
        value: "1"
